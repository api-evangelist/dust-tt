openapi: 3.2.0
info:
  title: DUST API Documentation Conversations API
  version: 1.0.2
  description: The OpenAPI specification for the Dust.tt API
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://dust.tt
  description: Dust.tt API (us-central1)
- url: https://eu.dust.tt
  description: Dust.tt API (europe-west1)
tags:
- name: Conversations
  description: Conversations
paths:
  /api/v1/w/{wId}/assistant/conversations/{cId}/cancel:
    post:
      tags:
      - Conversations
      summary: Cancel message generation in a conversation
      parameters:
      - name: wId
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID
      - name: cId
        in: path
        required: true
        schema:
          type: string
        description: Conversation ID
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - messageIds
              properties:
                messageIds:
                  type: array
                  description: List of message IDs to cancel generation for
                  items:
                    type: string
      responses:
        '200':
          description: Message generation successfully canceled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates if the cancellation was successful
        '400':
          description: Invalid request (invalid query parameters or request body)
      operationId: postApiV1WByWIdAssistantConversationsByCIdCancel
      x-operation-id-source: derived
  /api/v1/w/{wId}/assistant/conversations/{cId}/consumption:
    get:
      summary: Get conversation consumption
      description: 'Get the same credit breakdown as the conversation consumption view for a conversation

        the caller can read. Returns stable billed credits for terminal agent messages, including

        superseded message versions and accessible recursively spawned run-agent conversations.

        In-progress messages are excluded until they reach a terminal state.


        Details use each billed message''s newest complete stored attribution. They are null when

        no messages have positive billed credits or any billed message lacks complete attribution.

        Agent work and tool attributions partition the bill. Models and agents are alternative

        groupings of that bill, not additional charges. This endpoint does not return token counts

        or a cached-versus-uncached input breakdown.'
      tags:
      - Conversations
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: wId
        required: true
        description: ID of the workspace
        schema:
          type: string
      - in: path
        name: cId
        required: true
        description: ID of the conversation
        schema:
          type: string
      responses:
        '200':
          description: Conversation consumption retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationConsumption'
        '400':
          description: Invalid request parameters.
        '401':
          description: Invalid or missing authentication credentials.
        '403':
          description: The workspace plan does not allow API access.
        '404':
          description: Workspace or conversation not found, deleted, or not accessible to the caller.
        '500':
          description: Internal server error.
      operationId: getApiV1WByWIdAssistantConversationsByCIdConsumption
      x-operation-id-source: derived
  /api/v1/w/{wId}/assistant/conversations/{cId}/content_fragments:
    post:
      summary: Create a content fragment
      description: Create a new content fragment in the workspace identified by {wId}.
      tags:
      - Conversations
      parameters:
      - in: path
        name: wId
        required: true
        description: ID of the workspace
        schema:
          type: string
      - in: path
        name: cId
        required: true
        description: ID of the conversation
        schema:
          type: string
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentFragment'
      responses:
        '200':
          description: Content fragment created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentFragment'
        '400':
          description: Bad Request. Missing or invalid parameters.
        '401':
          description: Unauthorized. Invalid or missing authentication token.
        '500':
          description: Internal Server Error.
      operationId: postApiV1WByWIdAssistantConversationsByCIdContentFragments
      x-operation-id-source: derived
  /api/v1/w/{wId}/assistant/conversations/{cId}/events:
    get:
      summary: Get the events for a conversation
      description: 'Stream conversation events for the workspace identified by {wId} using Server-Sent Events (SSE).

        The stream starts with a `:connect` comment. Event frames carry JSON with `eventId` and `data` fields. A plain-text `data: done` frame ends the current connection; clients may reconnect with `lastEventId`.'
      tags:
      - Conversations
      parameters:
      - in: path
        name: wId
        required: true
        description: ID of the workspace
        schema:
          type: string
      - in: path
        name: cId
        required: true
        description: ID of the conversation
        schema:
          type: string
      - in: query
        name: lastEventId
        required: false
        description: Redis stream ID of the last received conversation event. Omit or pass an empty value to start from the available history.
        schema:
          type: string
      security:
      - BearerAuth: []
      responses:
        '200':
          description: SSE event stream with a `:connect` comment followed by conversation frames. Each conversation frame contains JSON with `eventId` and `data` fields. The `data` field is the conversation event. View the "Events" page from this documentation for more information.
          content:
            text/event-stream:
              schema:
                type: object
                required:
                - eventId
                - data
                properties:
                  eventId:
                    type: string
                    description: Redis stream ID used as the resume cursor.
                  data:
                    type: object
                    description: Conversation event discriminated by its type field.
        '400':
          description: Bad Request. Missing or invalid parameters.
        '401':
          description: Unauthorized. Invalid or missing authentication token.
        '404':
          description: Conversation not found.
        '500':
          description: Internal Server Error.
      operationId: getApiV1WByWIdAssistantConversationsByCIdEvents
      x-operation-id-source: derived
  /api/v1/w/{wId}/assistant/conversations/{cId}/files/{rel}:
    get:
      tags:
      - Conversations
      summary: Download a conversation-scoped file by path
      description: 'Download a file from a conversation''s file system by its scoped path. Pass the

        canonical `filePath` surfaced in a message action''s `generatedFiles` (the legacy

        `conversation/foo.pdf` form is also accepted). The file content is streamed

        directly from the conversation mount.'
      parameters:
      - name: wId
        in: path
        required: true
        description: ID of the workspace
        schema:
          type: string
      - name: cId
        in: path
        required: true
        description: ID of the conversation
        schema:
          type: string
      - name: rel
        in: path
        required: true
        description: 'Conversation-scoped file path: the canonical `filePath` returned in a message

          action''s `generatedFiles`, or the legacy `conversation/foo.pdf` form. Paths

          scoped to another conversation or to a different scope are rejected. Path

          traversal segments (`..`) are rejected.

          '
        schema:
          type: string
      security:
      - BearerAuth: []
      responses:
        '200':
          description: File content streamed directly.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Missing or invalid path parameters (e.g. missing or wrong scope prefix).
        '403':
          description: Resolved path is outside the conversation scope.
        '404':
          description: Conversation or file not found.
      operationId: getApiV1WByWIdAssistantConversationsByCIdFilesByRel
      x-operation-id-source: derived
  /api/v1/w/{wId}/assistant/conversations/{cId}:
    get:
      summary: Get a conversation
      description: Get a conversation in the workspace identified by {wId}. Supports optional pagination of message content via limit and lastValue query parameters.
      tags:
      - Conversations
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: wId
        required: true
        description: ID of the workspace
        schema:
          type: string
      - in: path
        name: cId
        required: true
        description: ID of the conversation
        schema:
          type: string
      - in: query
        name: limit
        required: false
        description: Maximum number of messages to return. When omitted, all messages are returned.
        schema:
          type: integer
      - in: query
        name: lastValue
        required: false
        description: Cursor value (message rank) from a previous response to fetch the next page of messages.
        schema:
          type: integer
      responses:
        '200':
          description: Conversation retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          description: Bad Request. Missing or invalid parameters.
        '401':
          description: Unauthorized. Invalid or missing authentication token.
        '404':
          description: Conversation not found.
        '500':
          description: Internal Server Error.
      operationId: getApiV1WByWIdAssistantConversationsByCId
      x-operation-id-source: derived
    patch:
      summary: Update a conversation
      description: Update a conversation's title or mark it as read or unread in the workspace identified by {wId}.
      tags:
      - Conversations
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: wId
        required: true
        description: ID of the workspace
        schema:
          type: string
      - in: path
        name: cId
        required: true
        description: ID of the conversation
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                required:
                - read
                properties:
                  read:
                    type: boolean
              - type: object
                required:
                - title
                properties:
                  title:
                    type: string
                    maxLength: 512
      responses:
        '200':
          description: Conversation updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Bad Request. Invalid or missing parameters.
        '401':
          description: Unauthorized. Invalid or missing authentication token.
        '404':
          description: Conversation not found.
        '500':
          description: Internal Server Error.
      operationId: patchApiV1WByWIdAssistantConversationsByCId
      x-operation-id-source: derived
  /api/v1/w/{wId}/assistant/conversations/{cId}/messages/{mId}/answer-question:
    post:
      summary: Answer a user question in a conversation message
      description: Submits an answer to a question asked by an agent in a specific message
      tags:
      - Conversations
      parameters:
      - in: path
        name: wId
        required: true
        schema:
          type: string
        description: Workspace ID
      - in: path
        name: cId
        required: true
        schema:
          type: string
        description: Conversation ID
      - in: path
        name: mId
        required: true
        schema:
          type: string
        description: Message ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - actionId
              - answer
              properties:
                actionId:
                  type: string
                  description: ID of the action to answer
                answer:
                  type: object
                  required:
                  - selectedOptions
                  properties:
                    selectedOptions:
                      type: array
                      items:
                        type: integer
                      description: Indices of selected options
                    customResponse:
                      type: string
                      description: Optional free-text response
      responses:
        '200':
          description: Answer submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Invalid request body or action not blocked
        '403':
          description: User not authorized to answer this question
        '404':
          description: Conversation, message, or action not found
        '500':
          description: Internal server error
      security:
      - BearerAuth: []
      operationId: postApiV1WByWIdAssistantConversationsByCIdMessagesByMIdAnswerQuestion
      x-operation-id-source: derived
  /api/v1/w/{wId}/assistant/conversations/{cId}/messages/{mId}/edit:
    post:
      tags:
      - Conversations
      summary: Edit an existing message in a conversation
      parameters:
      - name: wId
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID
      - name: cId
        in: path
        required: true
        schema:
          type: string
        description: Conversation ID
      - name: mId
        in: path
        required: true
        schema:
          type: string
        description: Message ID to edit
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - content
              - mentions
              properties:
                content:
                  type: string
                  description: New content for the message
                mentions:
                  type: array
                  description: List of agent mentions in the message
                  items:
                    type: object
                    required:
                    - configurationId
                    properties:
                      configurationId:
                        type: string
                        description: ID of the mentioned agent configuration
      responses:
        '200':
          description: Message successfully edited
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    description: The edited user message
                  agentMessages:
                    type: array
                    description: Optional array of agent messages generated in response
        '400':
          description: Invalid request (message not found or not a user message)
      operationId: postApiV1WByWIdAssistantConversationsByCIdMessagesByMIdEdit
      x-operation-id-source: derived
  /api/v1/w/{wId}/assistant/conversations/{cId}/messages/{mId}/events:
    get:
      summary: Get events for a message
      description: 'Stream events for a message in the workspace identified by {wId} using Server-Sent Events (SSE).

        The stream starts with a `:connect` comment. Message frames carry JSON with `eventId` and `data` fields. A plain-text `data: done` frame ends the current connection; clients may reconnect with `lastEventId`.'
      tags:
      - Conversations
      parameters:
      - in: path
        name: wId
        required: true
        description: ID of the workspace
        schema:
          type: string
      - in: path
        name: cId
        required: true
        description: ID of the conversation
        schema:
          type: string
      - in: path
        name: mId
        required: true
        description: ID of the message
        schema:
          type: string
      - in: query
        name: lastEventId
        required: false
        description: Redis stream ID of the last received message event. Omit or pass an empty value to start from the available history.
        schema:
          type: string
      security:
      - BearerAuth: []
      responses:
        '200':
          description: SSE event stream with a `:connect` comment followed by message frames. The JSON `data` field in each message frame contains the event, discriminated by `type`.
          content:
            text/event-stream:
              schema:
                type: object
                required:
                - eventId
                - data
                properties:
                  eventId:
                    type: string
                    description: Redis stream ID used as the resume cursor.
                  data:
                    type: object
                    description: Agent message event discriminated by its type field.
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      operationId: getApiV1WByWIdAssistantConversationsByCIdMessagesByMIdEvents
      x-operation-id-source: derived
  /api/v1/w/{wId}/assistant/conversations/{cId}/messages/{mId}/validate-action:
    post:
      summary: Validate an action in a conversation message
      description: Approves or rejects an action taken in a specific message in a conversation
      tags:
      - Conversations
      parameters:
      - in: path
        name: wId
        required: true
        schema:
          type: string
        description: Workspace ID
      - in: path
        name: cId
        required: true
        schema:
          type: string
        description: Conversation ID
      - in: path
        name: mId
        required: true
        schema:
          type: string
        description: Message ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - actionId
              - approved
              properties:
                actionId:
                  type: string
                  description: ID of the action to validate
                approved:
                  type: boolean
                  description: Whether the action is approved or rejected
      responses:
        '200':
          description: Action validation successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Invalid request body
        '404':
          description: Conversation, message, or workspace not found
        '500':
          description: Internal server error
      security:
      - BearerAuth: []
      operationId: postApiV1WByWIdAssistantConversationsByCIdMessagesByMIdValidateAction
      x-operation-id-source: derived
  /api/v1/w/{wId}/assistant/conversations/{cId}/messages:
    post:
      summary: Create a message
      description: Create a message in the workspace identified by {wId} in the conversation identified by {cId}.
      tags:
      - Conversations
      parameters:
      - in: path
        name: wId
        required: true
        description: ID of the workspace
        schema:
          type: string
      - in: path
        name: cId
        required: true
        description: ID of the conversation
        schema:
          type: string
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        '200':
          description: Message created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Bad Request. Missing or invalid parameters.
        '401':
          description: Unauthorized. Invalid or missing authentication token.
        '403':
          description: Forbidden. Workspace or usage limits exceeded, or access denied.
        '429':
          description: Rate limit exceeded.
        '500':
          description: Internal Server Error.
      operationId: postApiV1WByWIdAssistantConversationsByCIdMessages
      x-operation-id-source: derived
  /api/v1/w/{wId}/assistant/conversations:
    post:
      summary: Create a new conversation
      description: Create a new conversation in the workspace identified by {wId}.
      tags:
      - Conversations
      parameters:
      - in: path
        name: wId
        required: true
        description: ID of the workspace
        schema:
          type: string
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              properties:
                message:
                  $ref: '#/components/schemas/Message'
                contentFragments:
                  type: array
                  items:
                    $ref: '#/components/schemas/ContentFragment'
                  description: The list of content fragments to attach to this conversation (optional)
                title:
                  type: string
                  description: The title of the conversation
                  example: My conversation
                skipToolsValidation:
                  type: boolean
                  description: Whether to skip the tools validation of the agent messages triggered by this user message (optional, defaults to false)
                  example: false
                blocking:
                  type: boolean
                  description: Whether to wait for the agent to generate the initial message. If true the query will wait for the agent's answer. If false (default), the API will return a conversation ID directly and you will need to use streaming events to get the messages.
                  example: true
                depth:
                  type: integer
                  minimum: 0
                  description: The depth of the conversation in a chain of sub-agent conversations (optional, defaults to 0)
                  example: 0
                spaceId:
                  type: string
                  description: The sId of the space (project) in which to create the conversation (optional). If not provided, the conversation is created outside projects
                  example: space_abc123
      responses:
        '200':
          description: Conversation created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded.
        '500':
          description: Internal Server Error
      operationId: postApiV1WByWIdAssistantConversations
      x-operation-id-source: derived
  /api/v1/w/{wId}/files:
    post:
      tags:
      - Conversations
      summary: Create a file upload URL
      parameters:
      - name: wId
        in: path
        required: true
        description: ID of the workspace
        schema:
          type: string
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contentType
              - fileName
              - fileSize
              - useCase
              - useCaseMetadata
              properties:
                contentType:
                  type: string
                  description: MIME type of the file
                fileName:
                  type: string
                  description: Name of the file
                fileSize:
                  type: integer
                  description: Size of the file in bytes
                useCase:
                  type: string
                  description: Intended use case for the file, use "conversation"
                useCaseMetadata:
                  type: string
                  description: (optional) Metadata for the use case, for conversation useCase should be dictionary with conversationId stringified
      responses:
        '200':
          description: File upload URL created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  file:
                    type: object
                    properties:
                      sId:
                        type: string
                        description: Unique string identifier for the file
                      uploadUrl:
                        type: string
                        description: Upload URL for the file
        '400':
          description: Invalid request or unsupported file type
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded
      operationId: postApiV1WByWIdFiles
      x-operation-id-source: derived
components:
  schemas:
    ConversationConsumptionDetails:
      type: object
      description: Attribution reconciled to the bill through model input rows. Agent work plus tool attributed credits partition the bill; models and agents are alternative groupings, not additional charges.
      required:
      - agentWorkCredits
      - tools
      - models
      - agents
      properties:
        agentWorkCredits:
          type: number
          description: Credits attributed to agent work rather than visible tools.
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ConversationConsumptionToolDetails'
        models:
          type: array
          items:
            $ref: '#/components/schemas/ConversationConsumptionModelDetails'
        agents:
          type: array
          items:
            $ref: '#/components/schemas/ConversationConsumptionAgentDetails'
    ConversationConsumptionModelDetails:
      type: object
      required:
      - providerId
      - modelId
      - displayName
      - attributedCredits
      properties:
        providerId:
          type: string
        modelId:
          type: string
          description: Provider model identifier, not an internal database identifier.
        displayName:
          type: string
        attributedCredits:
          type: number
          description: Reconciled credits grouped by model, including tool attribution linked to its runs. Overlaps agent work and tool totals.
    ConversationConsumptionAgentDetails:
      type: object
      required:
      - agentId
      - name
      - pictureUrl
      - billedCredits
      - agentWorkCredits
      - tools
      - models
      properties:
        agentId:
          type: string
          description: String identifier of the agent.
        name:
          type: string
        pictureUrl:
          type:
          - string
          - 'null'
        billedCredits:
          type: number
          description: Stable billed credits grouped under this agent. Hidden helpers are folded into their parent agent.
        agentWorkCredits:
          type: number
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ConversationConsumptionToolDetails'
        models:
          type: array
          items:
            $ref: '#/components/schemas/ConversationConsumptionModelDetails'
    ConversationConsumptionToolDetails:
      type: object
      required:
      - label
      - internalMCPServerName
      - toolName
      - callCount
      - attributedCredits
      - directCredits
      - pending
      properties:
        label:
          type: string
          description: Display label of the tool.
        internalMCPServerName:
          type:
          - string
          - 'null'
          description: Internal MCP server name, or null for an external server.
        toolName:
          type: string
        callCount:
          type: integer
          description: Number of attributed calls grouped under this tool.
        attributedCredits:
          type: number
          description: Share of billed credits attributed to the tool, including model work and direct charges.
        directCredits:
          type: number
          description: Direct tool charges already included in attributedCredits, not an additional charge.
        pending:
          type: boolean
          description: Whether any grouped tool attribution is pending.
    Context:
      type: object
      required:
      - username
      - timezone
      properties:
        username:
          type: string
          description: Username in the current context
          example: johndoe123
        timezone:
          type: string
          description: User's timezone
          example: America/New_York
        fullName:
          type: string
          description: User's full name in the current context
          example: John Doe
        email:
          type: string
          description: User's email in the current context
          example: john.doe@example.com
        profilePictureUrl:
          type: string
          description: URL of the user's profile picture
          example: https://example.com/profiles/johndoe123.jpg
        selectedSpaceIds:
          type: array
          items:
            type: string
        agenticMessageData:
          type: object
          properties:
            type:
              type: string
              enum:
              - run_agent
              - agent_handover
              description: Type of the agentic message
            originMessageId:
              type: string
              description: ID of the origin message
