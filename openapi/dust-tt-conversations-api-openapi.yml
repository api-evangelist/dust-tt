      properties:
        providerId:
          type: string
          description: The model provider id (e.g. "anthropic", "openai", "google_ai_studio").
          example: anthropic
        modelId:
          type: string
          description: The model id to run (e.g. "claude-sonnet-4-20250514").
          example: claude-sonnet-4-20250514
        reasoningEffort:
          type: string
          enum:
          - none
          - minimal
          - low
          - medium
          - high
          - xhigh
          - maximal
          - light
          description: Optional reasoning effort. Honored only if the resolved model supports it. `light` is a deprecated alias of `low`.
          example: medium
